<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <form (ngSubmit)="save()" #settingsForm="ngForm">
    <ion-list inset="true">
      <ion-list-header>Account details</ion-list-header>

      <ion-item>
        <ion-icon slot="start" name="card-outline" color="medium"></ion-icon>
        <ion-input
          label="Account number"
          labelPlacement="stacked"
          name="accountNumber"
          [(ngModel)]="settings.accountNumber"
          placeholder="e.g. 123456789"
          required
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-icon slot="start" name="layers-outline" color="medium"></ion-icon>
        <ion-input
          label="Portion"
          labelPlacement="stacked"
          name="portion"
          [(ngModel)]="settings.portion"
          placeholder="e.g. Portion 4"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-icon slot="start" name="person-outline" color="medium"></ion-icon>
        <ion-input
          label="Account holder (initials and surname)"
          labelPlacement="stacked"
          name="accountHolder"
          [(ngModel)]="settings.accountHolder"
          placeholder="e.g. J Smith"
          required
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-icon slot="start" name="call-outline" color="medium"></ion-icon>
        <ion-input
          label="Contact number"
          labelPlacement="stacked"
          name="contactNumber"
          type="tel"
          [(ngModel)]="settings.contactNumber"
          placeholder="e.g. 082 000 0000"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-icon slot="start" name="home-outline" color="medium"></ion-icon>
        <ion-textarea
          label="Physical address"
          labelPlacement="stacked"
          name="homeAddress"
          [(ngModel)]="settings.homeAddress"
          autoGrow="true"
          placeholder="Street, suburb, city"
        ></ion-textarea>
      </ion-item>
    </ion-list>

    <ion-list inset="true">
      <ion-list-header>Email</ion-list-header>

      <ion-item>
        <ion-icon slot="start" name="mail-outline" color="medium"></ion-icon>
        <ion-input
          label="Your email (recorded on the reading)"
          labelPlacement="stacked"
          name="submitterEmail"
          type="email"
          [(ngModel)]="settings.submitterEmail"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-icon slot="start" name="send-outline" color="medium"></ion-icon>
        <ion-input
          label="Recipient email"
          labelPlacement="stacked"
          name="recipientEmail"
          type="email"
          [(ngModel)]="settings.recipientEmail"
          required
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-icon slot="start" name="people-outline" color="medium"></ion-icon>
        <ion-input
          label="BCC (comma or semicolon separated, optional)"
          labelPlacement="stacked"
          name="bccList"
          [(ngModel)]="settings.bccList"
          placeholder="e.g. me@example.com, spouse@example.com"
        ></ion-input>
      </ion-item>
    </ion-list>

    <div class="ion-padding">
      <ion-button expand="block" type="submit" [disabled]="settingsForm.invalid">
        <ion-icon slot="start" name="checkmark-outline"></ion-icon>
        Save settings
      </ion-button>
    </div>
  </form>

  <ion-list inset="true">
    <ion-list-header>Google Account</ion-list-header>

    <ion-item lines="none" *ngIf="googleAuth.signedInEmail() as email">
      <ion-label>
        Signed in as<br />
        <strong>{{ email }}</strong>
      </ion-label>
    </ion-item>
    <ion-item lines="none" *ngIf="!googleAuth.signedInEmail()">
      <ion-label>
        Not signed in. Stays signed in for about an hour once you do (or until you close the
        browser tab) - you'll also be prompted automatically the first time you tap "Submit
        reading" if needed.
      </ion-label>
    </ion-item>

    <ion-item lines="none">
      <button
        *ngIf="!googleAuth.signedInEmail()"
        type="button"
        class="google-signin-button"
        [disabled]="signingIn"
        (click)="signInWithGoogle()"
      >
        <svg class="google-logo" viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
        </svg>
        <span>Sign in with Google</span>
      </button>
      <ion-button *ngIf="googleAuth.signedInEmail()" fill="clear" color="danger" (click)="signOutOfGoogle()">
        <ion-icon slot="start" name="log-out-outline"></ion-icon>
        Sign out
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
